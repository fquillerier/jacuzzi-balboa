; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env]
monitor_speed = 115200
framework = arduino
extra_scripts = pre:web/gen_webui.py
lib_deps =
	https://github.com/dawidchyrzynski/arduino-home-assistant.git#2.1.0
	links2004/WebSockets@^2.3.7
	https://github.com/EinarArnason/ArduinoQueue.git@^1.2.5
	https://github.com/netmindz/ESP-WebOTA.git#disable-interrupts
	https://github.com/tzapu/WiFiManager.git#v2.0.17

[esp32]
platform = espressif32@~6.3.2

; Flash layout: 2 x 1.9 MB for the program (instead of 2 x 1.25 MB). The file system (SPIFFS) is not used.
; Changing it needs a full install over USB (jacuzzi-full-install.bin): the Wi-Fi update keeps the old layout.

; Generic ESP32 DevKit (ESP-WROOM-32, 30 or 38 pins)
[env:esp32dev]
platform = ${esp32.platform}
board = esp32dev
board_build.partitions = min_spiffs.csv
monitor_filters = esp32_exception_decoder

[env:wemos_d1_mini32]
platform = ${esp32.platform}
board = wemos_d1_mini32
board_build.partitions = min_spiffs.csv
monitor_filters = esp32_exception_decoder
