name: Build firmware

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('sensor/platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO and esptool
        run: pip install --upgrade platformio esptool

      - name: Build
        run: cd sensor && pio run -e esp32dev

      - name: Collect binaries
        run: |
          set -e
          B=sensor/.pio/build/esp32dev
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -n 1)
          mkdir -p out
          cp $B/firmware.bin out/jacuzzi-update.bin
          # Single image for a first install with a web flasher, written at address 0x0
          esptool.py --chip esp32 merge_bin -o out/jacuzzi-full-install.bin \
            --flash_mode dio --flash_size 4MB \
            0x1000 $B/bootloader.bin \
            0x8000 $B/partitions.bin \
            0xe000 "$BOOT_APP0" \
            0x10000 $B/firmware.bin
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: jacuzzi-firmware
          path: out/*.bin

      # Every build of main publishes (or refreshes) the release for the version in sensor.cpp.
      # The module's "Verifică actualizări" button reads the newest release from the GitHub API.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VER=$(grep -oP '#define FW_VERSION "\K[^"]+' sensor/src/sensor.cpp)
          SHA=$(sha256sum out/jacuzzi-update.bin | cut -d' ' -f1)
          # notes: this version's section of CHANGELOG.md, else the commit message
          awk -v v="## $VER" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md | sed '/^$/d' > notes.md || true
          if [ ! -s notes.md ]; then git log -1 --format=%B | grep -vE '^(Co-Authored-By|Claude-Session):' > notes.md; fi
          printf '\nsha256: %s\n' "$SHA" >> notes.md
          cat notes.md
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" out/*.bin --clobber
            gh release edit "v$VER" --notes-file notes.md
          else
            gh release create "v$VER" out/*.bin --title "v$VER" --notes-file notes.md --target "$GITHUB_SHA" --latest
          fi
