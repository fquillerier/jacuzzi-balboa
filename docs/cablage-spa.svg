<text x="1130" y="885" text-anchor="middle" font-size="13" fill="#475569">ESP32 DevKitC V4 – vue de dessus, USB en haut</text>
<rect x="20" y="1160" width="1360" height="262" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="40" y="1188" text-anchor="start" font-size="17" fill="#111" font-weight="bold">À retenir (montage final, sans prise de courant)</text>
<text x="40" y="1217" text-anchor="start" font-size="14" fill="#111">• Repérez chaque fil par continuité avec les numéros gravés sur la prise : les couleurs du câble ne veulent rien dire.</text>
<text x="40" y="1244" text-anchor="start" font-size="14" fill="#111">• Broches RX et TX de la carte (marquées ✗) : ce sont celles de l'USB, ne pas les utiliser. Le module va sur GPIO19 et GPIO23.</text>
<text x="40" y="1271" text-anchor="start" font-size="14" fill="#111">• VCC du module sur 3V3 (pas 5V) : ses sorties restent ainsi à 3,3 V, sans danger pour l'ESP32.</text>
<text x="40" y="1298" text-anchor="start" font-size="14" fill="#111">• Toutes les masses sont communes : circuit 1 du spa, GND de l'ESP32, GND du module, bas de R2. Borne ⏚ du module : laissée libre.</text>
<text x="40" y="1325" text-anchor="start" font-size="14" fill="#111">• Le 9 V (circuit 6) passe TOUJOURS par l'abaisseur : jamais directement sur l'ESP32. Circuits 7 et 8 isolés.</text>
<text x="40" y="1352" text-anchor="start" font-size="14" fill="#111">• Jamais d'ordinateur ou de chargeur sur l'USB-C pendant que l'abaisseur est branché : 1re installation par USB au bureau, ensuite mises à jour par Wi-Fi.</text>
<text x="40" y="1379" text-anchor="start" font-size="14" fill="#111">• Visser l'antenne externe sur la prise u.FL du WROOM-32U avant la mise sous tension.</text>
<text x="40" y="1406" text-anchor="start" font-size="14" fill="#111">• Aucune trame reçue alors que la sélection est détectée : inverser A+ et B− (sans risque).</text>
</svg>