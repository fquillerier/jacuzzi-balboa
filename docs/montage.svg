<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="DejaVu Sans, Arial, sans-serif" font-size="15">
  <rect width="1100" height="640" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">Montage complet – spa Balboa GL8000 (port J70)</text>

  <!-- J70 connector -->
  <rect x="40" y="90" width="210" height="330" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="145" y="80" text-anchor="middle" font-weight="bold" fill="#111">Câble Micro-Fit → J70</text>
  <g font-weight="bold" fill="#fff" text-anchor="middle">
    <circle cx="80" cy="130" r="18" fill="#222"/><text x="80" y="135">8</text>
    <circle cx="150" cy="130" r="18" fill="#222"/><text x="150" y="135">7</text>
    <circle cx="80" cy="200" r="18" fill="#dc2626"/><text x="80" y="205">6</text>
    <circle cx="150" cy="200" r="18" fill="#d97706"/><text x="150" y="205">5</text>
    <circle cx="80" cy="270" r="18" fill="#9ca3af"/><text x="80" y="275">4</text>
    <circle cx="150" cy="270" r="18" fill="#16a34a"/><text x="150" y="275">3</text>
    <circle cx="80" cy="340" r="18" fill="#9ca3af"/><text x="80" y="345">2</text>
    <circle cx="150" cy="340" r="18" fill="#2563eb"/><text x="150" y="345">1</text>
  </g>
  <text x="52" y="392" font-size="13" fill="#475569">ergot à gauche</text>
  <text x="52" y="409" font-size="13" fill="#475569">1 en bas à droite</text>

  <!-- RS485 module -->
  <rect x="430" y="90" width="210" height="190" rx="10" fill="#eef2ff" stroke="#3730a3" stroke-width="2"/>
  <text x="535" y="80" text-anchor="middle" font-weight="bold" fill="#111">Module TTL–RS485</text>
  <text x="450" y="130" fill="#111">B</text><text x="450" y="175" fill="#111">A</text>
  <text x="620" y="130" text-anchor="end" fill="#111">RXD</text>
  <text x="620" y="170" text-anchor="end" fill="#111">TXD</text>
  <text x="620" y="210" text-anchor="end" fill="#111">VCC</text>
  <text x="620" y="250" text-anchor="end" fill="#111">GND</text>

  <!-- ESP32 -->
  <rect x="820" y="90" width="230" height="330" rx="10" fill="#ecfdf5" stroke="#065f46" stroke-width="2"/>
  <text x="935" y="80" text-anchor="middle" font-weight="bold" fill="#111">ESP32 DevKit</text>
  <text x="840" y="130" fill="#111">GPIO19</text>
  <text x="840" y="170" fill="#111">GPIO23</text>
  <text x="840" y="210" fill="#111">3V3</text>
  <text x="840" y="250" fill="#111">GND</text>
  <text x="840" y="345" fill="#111">GPIO18</text>
  <text x="935" y="400" text-anchor="middle" font-size="13" fill="#475569">alimentation : USB 5 V</text>

  <!-- pin1 -> B, pin3 -> A -->
  <path d="M168 340 H330 V125 H440" fill="none" stroke="#2563eb" stroke-width="4"/>
  <path d="M168 270 H300 V170 H440" fill="none" stroke="#16a34a" stroke-width="4"/>
  <!-- TTL side -->
  <path d="M630 125 H830" stroke="#7c3aed" stroke-width="3"/>
  <path d="M630 165 H830" stroke="#0891b2" stroke-width="3"/>
  <path d="M630 205 H830" stroke="#dc2626" stroke-width="3"/>
  <path d="M630 245 H830" stroke="#222" stroke-width="3"/>
  <text x="730" y="118" text-anchor="middle" font-size="12" fill="#475569">RXD → GPIO19</text>
  <text x="730" y="158" text-anchor="middle" font-size="12" fill="#475569">TXD → GPIO23</text>

  <!-- divider -->
  <path d="M168 200 H260 V470 H400" fill="none" stroke="#d97706" stroke-width="4"/>
  <rect x="400" y="455" width="110" height="30" rx="4" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="455" y="476" text-anchor="middle" font-weight="bold" fill="#111">R1 4,7 kΩ</text>
  <path d="M510 470 H700" stroke="#d97706" stroke-width="4"/>
  <circle cx="700" cy="470" r="6" fill="#d97706"/>
  
  <text x="705" y="455" font-size="12" fill="#475569">≈ 3,3 V</text>
  <path d="M700 470 V510" stroke="#d97706" stroke-width="4"/>
  <rect x="625" y="510" width="150" height="30" rx="4" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="700" y="531" text-anchor="middle" font-weight="bold" fill="#111">R2 2 × 4,7 kΩ</text>
  <path d="M700 540 V590" stroke="#222" stroke-width="3"/>

  <!-- ground bus -->
  <path d="M168 130 H220 V590 H790 V245" fill="none" stroke="#222" stroke-width="3"/>
  <circle cx="790" cy="245" r="6" fill="#222"/>
  <text x="560" y="612" text-anchor="middle" font-size="13" fill="#475569">Masse commune : broche 7 (ou 8) du spa · GND de l'ESP32 · GND du module RS485 · bas de R2</text>

  <!-- pin 6 note -->
  <g font-size="13">
    <text x="30" y="450" fill="#dc2626" font-weight="bold">Broche 6 (≈ 9 V) :</text>
    <text x="30" y="468" fill="#dc2626">NE PAS brancher</text>
    <text x="30" y="486" fill="#dc2626">pour le test USB.</text>
    <text x="30" y="510" fill="#dc2626">Plus tard : abaisseur</text>
    <text x="30" y="528" fill="#dc2626">5 V → broche 5V ESP32</text>
    <text x="30" y="546" fill="#dc2626">(jamais avec l'USB).</text>
    <text x="30" y="572" fill="#475569">Broches 2 et 4 : libres.</text>
  </g>
  <path d="M700 470 H770 V340 H782 A8 8 0 0 1 798 340 H830" fill="none" stroke="#d97706" stroke-width="4"/>
</svg>
